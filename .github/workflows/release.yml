name: Build beta ZIP
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package preview
        if: github.event_name == 'workflow_dispatch'
        run: npm run release:build -- --preview
      - name: Package tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:build -- --tag $env:RELEASE_TAG
      - name: Classify version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content release-manifest.json | ConvertFrom-Json).applicationVersion
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: tboi-agent-windows
          path: dist/*
          retention-days: 30
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tboi-agent-windows
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
